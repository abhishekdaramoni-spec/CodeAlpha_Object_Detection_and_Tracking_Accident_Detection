<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Object Detection Platform{% endblock %}</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom style variables & layout -->
    <link href="{{ url_for('static', filename='css/style.css') }}?v=1.2" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>

    <div class="app-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="app-sidebar">
            <div class="sidebar-header">
                <i class="fa-solid fa-eye text-cyan me-2"></i>
                SURVEILLANCE<span>AI</span>
            </div>
            <ul class="sidebar-menu">
                <li class="sidebar-item {% if active_page == 'dashboard' %}active{% endif %}">
                    <a href="/dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
                </li>
                <li class="sidebar-item {% if active_page == 'upload' %}active{% endif %}">
                    <a href="/upload"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Media</a>
                </li>
            </ul>
        </aside>

        <!-- Main Workspace content -->
        <main class="app-content">
            <!-- Top Navbar -->
            <header class="app-navbar">
                <div class="d-flex align-items-center">
                    <button class="btn btn-outline-secondary d-lg-none me-2" id="sidebar-toggle">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <a href="/" class="navbar-brand-mobile">
                        <i class="fa-solid fa-eye text-cyan me-1"></i> SURVEILLANCE AI
                    </a>
                </div>
                
                <div class="d-flex align-items-center gap-3">
                    <div class="theme-toggle-btn" id="theme-toggle-btn" title="Toggle Light/Dark Theme">
                        <i class="fa-solid fa-sun" id="theme-toggle-icon"></i>
                    </div>
                </div>
            </header>

            <!-- Page Specific Container -->
            <div class="container-fluid p-4">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Lightbox Modal for Screenshots -->
    <div class="modal fade" id="lightboxModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-dark border-0 shadow-lg">
                <div class="modal-header border-0 p-3 d-flex justify-content-between align-items-center bg-black bg-opacity-75">
                    <span class="text-white font-size-sm fw-bold" id="lightboxTitle"><i class="fa-solid fa-camera-retro me-2 text-cyan"></i> Incident Evidence Capture</span>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0 text-center bg-black position-relative">
                    <div id="lightbox-tabs" class="d-none justify-content-center gap-2 py-3 bg-dark bg-opacity-90 border-bottom border-secondary border-opacity-25">
                        <button class="btn btn-sm btn-outline-info font-size-xs px-3" id="btn-pre" onclick="switchLightboxImage('pre')"><i class="fa-solid fa-backward me-1"></i> Pre-Impact</button>
                        <button class="btn btn-sm btn-outline-danger font-size-xs px-3" id="btn-impact" onclick="switchLightboxImage('impact')"><i class="fa-solid fa-burst me-1"></i> Impact Frame</button>
                        <button class="btn btn-sm btn-outline-warning font-size-xs px-3" id="btn-post" onclick="switchLightboxImage('post')"><i class="fa-solid fa-forward me-1"></i> Post-Impact</button>
                    </div>
                    <img id="lightboxImage" src="" class="img-fluid" alt="Fullscreen capture" style="max-height: 75vh; width: 100%; object-fit: contain;">
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS logic -->
    <script src="{{ url_for('static', filename='js/dashboard.js') }}?v=1.2"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
